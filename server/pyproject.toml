[project]
name = "fragment-api"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16.4",
  "asyncpg>=0.30.0",
  "brotli>=1.2.0",
  "cryptography>=45.0.6",
  "fastapi>=0.135.3",
  "greenlet>=3.2.4",
  "httpx>=0.28.1",
  "psycopg2-binary>=2.9.12",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.13.1",
  "pyjwt>=2.12.1",
  "python-telegram-bot>=22.3",
  "sqlalchemy>=2.0.49",
  "structlog>=25.5.0",
  "taskipy>=1.14.1",
  "tonutils>=2.0.5",
  "uvicorn>=0.44.0",
  "zstandard>=0.25.0",
  "sqlalchemy-utils>=0.42.1",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "pytest-mock>=3.15.1",
  "pytest-xdist[psutil]>=3.8.0",
  "ruff>=0.15.12",
]

[tool.taskipy.tasks]
api = { cmd = "uvicorn src.app:app --reload --workers 1 --host 0.0.0.0 --port 8000", help = "Run api service" }

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "UP", "T20", "B039"]
ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["F401"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "strict"
testpaths = ['tests']

[tool.coverage.run]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
] # See: https://github.com/nedbat/coveragepy/issues/831
